# nginx — JETSON (network_mode: host, so every backend is on 127.0.0.1)
worker_processes 1;
events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 1m;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 8080;

        # Dashboard pages (static files from ./web)
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            add_header Cache-Control "no-cache";
        }

        # Snapshot images only. The rest of /data (safety.db) must never be downloadable.
        location /data/snapshots/ {
            alias /data/snapshots/;
            add_header Cache-Control "public, max-age=86400";
        }
        location /data/ { return 404; }

        # Recorder API (FastAPI) — routes already start with /api
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebRTC signalling (WHEP) -> MediaMTX :8889.  /webrtc/cam01/whep -> /cam01/whep
        # Media itself goes directly over UDP/TCP 8189, not through nginx.
        location /webrtc/ {
            proxy_pass http://127.0.0.1:8889/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
        }

        # MQTT over WebSocket -> mosquitto :9001
        location /mqtt {
            proxy_pass http://127.0.0.1:9001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
