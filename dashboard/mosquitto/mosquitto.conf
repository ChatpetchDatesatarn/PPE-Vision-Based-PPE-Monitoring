listener 1883 127.0.0.1
protocol mqtt
listener 9001 127.0.0.1
protocol websockets
# Bound to 127.0.0.1: on-box clients (DeepStream, CiRA, recorder) and nginx reach the broker locally; the
# dashboard uses nginx /mqtt, and the PC reaches 1883 with `ssh -L 1883:127.0.0.1:1883`. Not open on the LAN.
# Prototype only (local network / Tailscale). Must add password_file before real use
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
