# AI Smart Safety Monitoring — Jetson Nano (JetPack 4.6.1)
# Usage: cd ~/safety/legacy/docker_v2 && docker-compose up -d --build
# CiRA CORE runs natively on the Jetson (not in Docker) and sends frames/events via MQTT to localhost:1883
version: "2.3"

services:
  # MQTT broker: 1883 = CiRA/simulator, 9001 = WebSocket (Dashboard via nginx /mqtt)
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: mosquitto
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  # Store events + snapshot images -> volume safety-data (served at /data on the Dashboard)
  recorder:
    build:
      context: ..
      dockerfile: legacy/docker_v2/Dockerfile.recorder
    container_name: recorder
    network_mode: host
    restart: unless-stopped
    depends_on: [mosquitto]
    environment:
      - MQTT_HOST=localhost
      - MAX_EVENTS=1000
    volumes:
      - safety-data:/data

  # Web Dashboard -> http://<Jetson IP>:8080  (WebSocket MQTT at /mqtt, history at /data)
  dashboard:
    image: nginx:1.27-alpine
    container_name: dashboard
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../legacy/dashboard_v2:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - safety-data:/data:ro

volumes:
  mosquitto-data:
  safety-data:
