# Mosquitto for the prototype (local network only)
# Run:  mosquitto -c mosquitto.conf -v

# MQTT/TCP: CiRA CORE, ESP32, simulator
listener 1883 0.0.0.0
protocol mqtt

# WebSocket: Web Dashboard
listener 9001 0.0.0.0
protocol websockets

# Prototype only: no password required. Must add password_file / TLS before real use
allow_anonymous true

persistence true
persistence_location ./mosquitto_data/
